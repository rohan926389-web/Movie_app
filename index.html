<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #e50914;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            background: #222;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .search-container {
            text-align: center;
            background: #222;
            padding-bottom: 15px;
        }

        .search-container input {
            width: 80%;
            max-width: 400px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        /* Category Filter Buttons Styling */
        .filter-buttons {
            text-align: center;
            padding: 15px;
            background: #181818;
        }

        .filter-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #e50914;
        }

        .hero {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(135deg, #222, #000);
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #ccc;
        }

        .movies {
            padding: 25px 15px;
        }

        .movies h2 {
            margin-bottom: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            padding-bottom: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .movie:hover {
            transform: scale(1.03);
        }

        .poster {
            height: 240px;
            width: 100%;
            object-fit: cover;
            background: #333;
        }

        .movie h3 {
            margin: 12px 5px 5px 5px;
            font-size: 18px;
        }

        .movie span {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .watch {
            display: inline-block;
            background: #e50914;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            background: #222;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 My Movie Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#movies">Movies</a>
        <a href="#about">About</a>
    </nav>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search movies...">
    </div>

    <!-- Category Filter Section -->
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterCategory('all')">All</button>
        <button class="filter-btn" onclick="filterCategory('action')">Action</button>
        <button class="filter-btn" onclick="filterCategory('comedy')">Comedy</button>
        <button class="filter-btn" onclick="filterCategory('drama')">Drama</button>
    </div>

    <section class="hero">
        <h2>Welcome to My Movie Website</h2>
        <p>Watch and explore your favourite movies.</p>
    </section>

    <section class="movies" id="movies">
        <h2>🔥 Latest Movies</h2>
        <div class="movie-grid" id="movieGrid">
            
            <div class="movie" data-category="action">
                <img src="https://picsum.photos/300/400?random=1" alt="Movie Poster" class="poster">
                <h3>Movie 1</h3>
                <span>Action</span>
                <a class="watch" href="#">Watch</a>
            </div>

            <div class="movie" data-category="comedy">
                <img src="https://picsum.photos/300/400?random=2" alt="Movie Poster" class="poster">
                <h3>Movie 2</h3>
                <span>Comedy</span>
                <a class="watch" href="#">Watch</a>
            </div>

            <div class="movie" data-category="drama">
                <img src="https://picsum.photos/300/400?random=3" alt="Movie Poster" class="poster">
                <h3>Movie 3</h3>
                <span>Drama</span>
                <a class="watch" href="#">Watch</a>
            </div>

            <div class="movie" data-category="action">
                <img src="https://picsum.photos/300/400?random=4" alt="Movie Poster" class="poster">
                <h3>Movie 4</h3>
                <span>Action</span>
                <a class="watch" href="#">Watch</a>
            </div>

        </div>
    </section>

    <footer id="about">
        <p>&copy; 2026 My Movie Website</p>
    </footer>

    <script>
        // Search Functionality
        const searchInput = document.getElementById('searchInput');
        const movieGrid = document.getElementById('movieGrid');
        const movies = movieGrid.getElementsByClassName('movie');

        searchInput.addEventListener('keyup', function() {
            let filter = searchInput.value.toLowerCase();
            
            for (let i = 0; i < movies.length; i++) {
                let title = movies[i].getElementsByTagName('h3')[0];
                let textValue = title.textContent || title.innerText;
                
                if (textValue.toLowerCase().indexOf(filter) > -1) {
                    movies[i].style.display = "";
                } else {
                    movies[i].style.display = "none";
                }
            }
        });

        // Category Filter Functionality
        function filterCategory(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            for (let i = 0; i < movies.length; i++) {
                let movieCategory = movies[i].getAttribute('data-category');
                if (category === 'all' || movieCategory === category) {
                    movies[i].style.display = "";
                } else {
                    movies[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
