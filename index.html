<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MovieHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      background: #151515;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(135deg, #222, #050505);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #e50914;
      color: white;
      padding: 14px 22px;
      border-radius: 6px;
      text-decoration: none;
    }

    .movies {
      padding: 50px 20px;
    }

    .movies h2 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .search {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 6px;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .movie {
      background: #191919;
      border-radius: 10px;
      overflow: hidden;
    }

    .poster {
      height: 260px;
      background: #292929;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
    }

    .movie-info {
      padding: 18px;
    }
