<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MovieHub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

/* HEADER */
header{
  background:#151515;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#e50914;
  font-size:30px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-size:17px;
}

nav a:hover{
  color:#e50914;
}

/* HERO */
.hero{
  min-height:500px;
  padding:90px 7%;
  display:flex;
  align-items:center;
  background:linear-gradient(120deg,#171717,#050505);
}

.hero h1{
  font-size:55px;
  max-width:650px;
  margin-bottom:20px;
}

.hero p{
  color:#bbb;
  font-size:20px;
  max-width:600px;
  margin-bottom:30px;
  line-height:1.5;
}

.btn{
  display:inline-block;
  background:#e50914;
  color:white;
  text-decoration:none;
  padding:15px 25px;
  border-radius:7px;
  font-size:18px;
}

.btn:hover{
  background:#b20710;
}

/* MOVIES */
.movies{
  padding:55px 6%;
}

.movies h2{
  font-size:35px;
  margin-bottom:25px;
}

/* SEARCH */
.search{
  width:100%;
  max-width:550px;
  padding:16px;
  border:0;
  border-radius:8px;
  margin-bottom:35px;
  font-size:17px;
  outline:none;
}

/* GRID */
.movie-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:25px;
}

.card{
  background:#181818;
  border-radius:12px;
  overflow:hidden;
  transition:0.
